    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vapt_studio_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

  <body class="bg-[#F4F6F9] dark:bg-[#070B0E] text-slate-900 dark:text-[#E6EDF3] antialiased selection:bg-teal-100 selection:text-teal-900 dark:selection:bg-teal-400/25 dark:selection:text-teal-200 transition-colors duration-200">
